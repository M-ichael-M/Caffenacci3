
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- SEO: panel biznesowy nie powinien być indeksowany -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="/src/assets/logo/logo_circle.png"
    />

    <!-- Responsywność -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Tytuł karty przeglądarki -->
    <title>Caffenacci Business</title>

    <!--
      Ustawia język dokumentu przed uruchomieniem Reacta,
      aby przeglądarka poprawnie wykryła język strony.
    -->
    <script>
      (function () {
        var lang = 'en';

        try {
          var stored = localStorage.getItem('caffenacci_ui_lang');

          if (stored === 'pl' || stored === 'en') {
            lang = stored;
          } else {
            var pref =
              (navigator.languages && navigator.languages[0]) ||
              navigator.language ||
              '';

            if (pref.toLowerCase().indexOf('pl') === 0) {
              lang = 'pl';
            }
          }
        } catch (e) {}

        document.documentElement.lang = lang;
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
