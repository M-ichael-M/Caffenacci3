<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#15100B" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Caffenacci</title>
    <script>
      // Ustaw język przed pierwszym renderem. Strony kawiarni zarządzają nim osobno;
      // strona główna i listingi biorą język z URL-a (/en/…), nie z przeglądarki.
      (function () {
        try {
          var p = location.pathname;
          if (/^\/(kawiarnia|cafe|preview)\//.test(p)) return;
          if (/^\/en(\/|$)/.test(p)) { document.documentElement.lang = 'en'; return; }
          if (p === '/' || /^\/kawiarnie\//.test(p)) { document.documentElement.lang = 'pl'; return; }
          var s = localStorage.getItem('caffenacci_site_lang');
          var l = (navigator.languages && navigator.languages[0]) || navigator.language || '';
          document.documentElement.lang = s === 'pl' || s === 'en' ? s : /^pl(-|$)/i.test(l) ? 'pl' : 'en';
        } catch (e) {}
      })();
    </script>
    <!--SEO_HEAD-->
  </head>
  <body>
    <div id="root"><!--SEO_BODY--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
