services:
  postgres:
    image: postgres:16
    container_name: caffenacci-postgres-dev
    environment:
      POSTGRES_DB: caffenacci
      POSTGRES_USER: caffenacci
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-caffenacci-dev-password}
    ports:
      - "5432:5432"
    volumes:
      - caffenacci_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caffenacci -d caffenacci"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  caffenacci_pgdata:
